name: Deploy Hosting

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm install -g firebase-tools
      - run: |
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only hosting --project etf-notify-app
      - name: Post-deploy smoke test
        run: |
          echo "=== TC-11: Firestore connectivity check ==="
          DASHBOARD=$(curl -sL https://etf-notify-app.web.app/)
          if echo "$DASHBOARD" | grep -q "NEXT_PUBLIC_FIREBASE_PROJECT_ID"; then
            echo "WARN: env var placeholder found in HTML (may indicate missing config)"
          fi
          if echo "$DASHBOARD" | grep -q "etf-notify-app"; then
            echo "PASS: Firebase project ID is embedded in the build"
          else
            echo "FAIL: Firebase project ID not found in deployed bundle"
            exit 1
          fi

          echo "=== TC-12: Route integrity check ==="
          DASH_SIZE=$(curl -sL -o /dev/null -w '%{size_download}' https://etf-notify-app.web.app/)
          SETTINGS_SIZE=$(curl -sL -o /dev/null -w '%{size_download}' https://etf-notify-app.web.app/settings/)
          echo "Dashboard size: $DASH_SIZE bytes"
          echo "Settings size: $SETTINGS_SIZE bytes"
          if [ "$DASH_SIZE" = "$SETTINGS_SIZE" ]; then
            echo "FAIL: Dashboard and Settings pages are identical (routing broken)"
            exit 1
          else
            echo "PASS: Dashboard and Settings return different content"
          fi
