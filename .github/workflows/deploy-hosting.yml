name: Deploy Hosting

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm install -g firebase-tools
      - run: |
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only hosting --project etf-notify-app
      - name: Deploy Firestore indexes
        run: |
          python -m pip install google-auth requests
          python worker/deploy_firestore_indexes.py
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
      - name: Pre-deploy build verification
        working-directory: web
        run: |
          echo "=== TC-11: Firebase config in build output ==="
          if grep -r "etf-notify-app" out/_next/ > /dev/null 2>&1; then
            echo "PASS: Firebase project ID found in JS bundle"
          else
            echo "FAIL: Firebase project ID not found in build output"
            echo "Check that web/.env.production exists and contains NEXT_PUBLIC_FIREBASE_PROJECT_ID"
            exit 1
          fi

          echo "=== TC-12: Route files exist ==="
          if [ -f "out/index.html" ] && [ -f "out/settings/index.html" ]; then
            DASH_SIZE=$(wc -c < out/index.html)
            SETTINGS_SIZE=$(wc -c < out/settings/index.html)
            echo "Dashboard: $DASH_SIZE bytes"
            echo "Settings: $SETTINGS_SIZE bytes"
            if [ "$DASH_SIZE" = "$SETTINGS_SIZE" ]; then
              echo "FAIL: Dashboard and Settings are identical (routing broken)"
              exit 1
            else
              echo "PASS: Dashboard and Settings are different pages"
            fi
          else
            echo "FAIL: Missing route files (expected out/index.html and out/settings/index.html)"
            ls -la out/ out/settings/ 2>/dev/null || true
            exit 1
          fi
