name: ETF Monitor

on:
  # Primary trigger: an external scheduler (cron-job.org) calls the
  # workflow_dispatch API every 10 minutes during the trading window.
  # External triggers are punctual, unlike GitHub's schedule events which
  # can be delayed by hours. Each run executes main.py once (~1-2 min),
  # keeping monthly Actions usage well inside the free tier.
  workflow_dispatch: {}
  schedule:
    # Best-effort backup only, in case the external scheduler is down.
    # UTC 02:05..06:35 = Beijing 10:05..14:35, every 30 minutes.
    # These may arrive hours late; main.py skips runs outside 10:00-15:00.
    - cron: '5,35 2-6 * * 1-5'

concurrency:
  group: etf-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r worker/requirements.txt
      - run: python worker/main.py
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
