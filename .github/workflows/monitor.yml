name: ETF Monitor

on:
  schedule:
    # Start early to absorb GitHub Actions cron delay (can be 1-5 hours).
    # UTC 00:00 = Beijing 08:00. Even with 2h delay, loop starts by 10:00.
    - cron: '0 0 * * 1-5'
    # Backup trigger in case first one is delayed too much.
    - cron: '0 1 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: etf-monitor-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r worker/requirements.txt
      - run: python worker/loop.py
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
