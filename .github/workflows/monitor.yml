name: ETF Monitor

on:
  schedule:
    # GitHub-hosted runners kill jobs at the 6-hour hard limit, so the job must
    # start no earlier than UTC 01:00 to survive until UTC 07:00 (Beijing 15:00).
    # Primary trigger: UTC 01:45 = Beijing 09:45, just before trading monitor
    # window opens at 10:00. Max runtime 01:45 -> 07:00 = 5h15m, safely under 6h.
    - cron: '45 1 * * 1-5'
    # Hourly backup triggers in case the primary cron is delayed or dropped
    # (GitHub cron delays can be 1-5 hours). loop.py waits until Beijing 10:00
    # if it starts early, and exits immediately if trading is already over, so
    # a backup that fires while the primary is still running just queues behind
    # it (concurrency below) and exits quickly.
    - cron: '45 2 * * 1-5'
    - cron: '45 3 * * 1-5'
    - cron: '45 4 * * 1-5'
    - cron: '45 5 * * 1-5'
  workflow_dispatch: {}

# Backup triggers queue behind the running job instead of cancelling it; when
# they finally run, loop.py sees trading is over and exits immediately.
concurrency:
  group: etf-monitor-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Under the 6-hour (360 min) hard cap; worst case runtime is 5h15m.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r worker/requirements.txt
      - run: python worker/loop.py
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
