name: ETF Monitor

on:
  schedule:
    # Backup start points. The job loops every 10 minutes until Beijing 15:00.
    # UTC 02:03/02:33 = Beijing 10:03/10:33.
    - cron: '3,33 2 * * 1-5'
    # UTC 03:03/05:03/06:03 = Beijing 11:03/13:03/14:03.
    - cron: '3 3,5,6 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: etf-monitor-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r worker/requirements.txt
      - run: python worker/loop.py
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
