name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r worker/requirements.txt
      # No secrets passed on purpose: tests must pass without credentials
      # (network-dependent tests self-skip).
      # -s avoids a pytest capture bug (ValueError: I/O operation on closed file).
      - run: python -m pytest worker/tests/ -s --tb=short

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
